site_name: shaapi
site_description: Scaffold lean, batteries-included FastAPI backends — like django-admin, for FastAPI.
site_url: https://shalom-302.github.io/shaapi/
repo_url: https://github.com/Shalom-302/shaapi
repo_name: Shalom-302/shaapi
copyright: Copyright &copy; Shalom — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: fr
          name: Français
          build: true
          nav_translations:
            Home: Accueil
            Getting started: Démarrage
            Learn FastAPI: Apprendre FastAPI
            Architecture: Architecture
            Build a feature: Créer une fonctionnalité
            Why Docker?: Pourquoi Docker ?
            Deployment: Déploiement

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Learn FastAPI: learn-fastapi.md
  - Architecture: architecture.md
  - Build a feature: create-a-feature.md
  - Why Docker?: why-docker.md
  - Deployment: deployment.md
