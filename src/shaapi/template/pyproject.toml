[project]
name = "shaapi"
version = "0.1.0"
description = "A lean, batteries-included FastAPI backend boilerplate."
authors = [{ name = "Shalom", email = "team@kaanari.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"

# Upper bounds mirror the original (known-good) Poetry caret constraints so a
# fresh lock cannot pull in breaking major/minor releases.
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.5,<0.116.0",
    "asgi-correlation-id>=4.3.3,<5.0.0",
    "fastapi-pagination>=0.12.29,<0.13.0",
    "fastapi-limiter>=0.1.6,<0.2.0",
    "asgiref>=3.8.1,<4.0.0",
    "msgspec>=0.18.6,<0.19.0",
    # Database
    "sqlalchemy>=2.0.35,<3.0.0",
    "sqlalchemy-crud-plus>=1.4.0,<2.0.0",
    "alembic>=1.14.0,<2.0.0",
    "asyncpg>=0.29.0,<0.30.0",
    "greenlet>=3.1.1,<4.0.0",
    "sqlalchemyseed>=2.0.0,<3.0.0",
    "python-ulid>=2.7.0,<3.0.0",
    # Cache / Redis
    "redis>=5.1.0,<6.0.0",
    # Auth / security / RBAC
    "python-jose>=3.3.0,<4.0.0",
    "passlib>=1.7.4,<2.0.0",
    "bcrypt>=4.2.0,<5.0.0",
    "cryptography>=43.0.1,<44.0.0",
    "casbin>=1.36.3,<2.0.0",
    "casbin-async-sqlalchemy-adapter>=1.5.0,<2.0.0",
    "fast-captcha>=0.3.2,<0.4.0",
    "itsdangerous>=2.2.0,<3.0.0",
    # Object storage (MinIO / S3 / GCS)
    "minio>=7.2.9,<8.0.0",
    "boto3>=1.35.39,<2.0.0",
    "google-cloud-storage>=2.18.2,<3.0.0",
    # Email
    "fastapi-mail>=1.4.1,<2.0.0",
    # Request parsing / i18n helpers
    "user-agents>=2.2.0,<3.0.0",
    "phonenumbers>=8.13.46,<9.0.0",
    "xdbsearchip>=1.0.2,<2.0.0",
    # Logging
    "loguru>=0.7.2,<0.8.0",
    # IANA time zone database (zoneinfo has no data on Windows / slim images)
    "tzdata>=2024.1",
]

# Opt-in observability stack. Install with: uv sync --extra monitoring
[project.optional-dependencies]
monitoring = [
    "prometheus-client>=0.21.0,<0.22.0",
    "opentelemetry-distro>=0.49b2,<0.50",
    "opentelemetry-instrumentation-fastapi>=0.49b2,<0.50",
    "opentelemetry-instrumentation-logging>=0.49b2,<0.50",
    "opentelemetry-exporter-otlp>=1.28.2,<2.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
