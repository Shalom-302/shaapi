[plugin]
name = "advanced_auth"
summary = "Two-factor authentication (TOTP/MFA) layered on top of the built-in users."
version = "0.1.0"

[dependencies]
packages = ["pyotp>=2.9"]

[post_add]
message = "MFA endpoints are under /admin/api/v1/auth/mfa (JWT-protected). Flow: POST /setup -> scan the otpauth_uri in an authenticator app -> POST /enable with a code. Use POST /verify for step-up checks. Dev auto-creates the table; for production run: ./docker-run.sh makemigrations \"add mfa\""
