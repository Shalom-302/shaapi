services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: shaapi:latest
    container_name: shaapi_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Point the app at the compose service names (overrides .env localhost)
      - POSTGRES_HOST=shaapi_postgres
      - REDIS_HOST=shaapi_redis
      - MINIO_ENDPOINT=shaapi_minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - shaapi

  postgres:
    image: postgres:16-alpine
    container_name: shaapi_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DATABASE:-shaapi}
    volumes:
      - shaapi_postgres:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DATABASE:-shaapi}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shaapi

  redis:
    image: redis:7-alpine
    container_name: shaapi_redis
    restart: unless-stopped
    volumes:
      - shaapi_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shaapi

  minio:
    image: minio/minio:latest
    container_name: shaapi_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - shaapi_minio:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - shaapi

volumes:
  shaapi_postgres:
  shaapi_redis:
  shaapi_minio:

networks:
  shaapi:
    driver: bridge
